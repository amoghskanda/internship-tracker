name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Collector tests
        working-directory: collector
        run: python -m unittest discover -s tests -v
      - name: Ranker and scheduler tests
        working-directory: runner
        run: python -m unittest discover -s tests -v
      - name: Offline ranking example
        run: >-
          python runner/scheduler/ranker.py
          --jobs examples/jobs.json
          --resume-profile runner/examples/resume-profile.example.json
          --output runner/data/demo-ranked.json

  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-collector"
version = "0.1.0"
description = "Collect explicit Summer 2027 internship postings into JSON"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
internship-collector = "internship_collector.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
